<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - WatchTower</title>
  <link rel="icon" type="image/png" href="assets/watchtower-transparent.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand-lockup" href="/" aria-label="Return to WatchTower dashboard">
        <img src="assets/watchtower-transparent.png" alt="" width="76" height="76">
        <span>WatchTower</span>
      </a>

      <div class="form-heading">
        <p class="eyebrow">Ops dashboard</p>
        <h1 id="login-title">Sign in to WatchTower</h1>
        <p class="intro-copy">
          WatchTower helps teams monitor web app errors, performance, and user feedback from one focused dashboard.
        </p>
      </div>

      <form class="login-form" id="login-form">
        <label>
          <span>Email</span>
          <input id="email" type="email" name="email" autocomplete="email" placeholder="fahad@watchtower.dev" required>
        </label>
        <div class="field-group">
          <label for="password">Password</label>
          <span class="password-field">
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
            <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                <path d="M7.3 7.5C4.2 9.2 2.5 12 2.5 12s3.5 6 9.5 6c1.5 0 2.8-.4 4-1"></path>
                <path d="M12.7 6.1C18.3 6.5 21.5 12 21.5 12s-.9 1.6-2.6 3.1"></path>
              </svg>
            </button>
          </span>
        </div>
        <div class="form-row">
          <label class="remember-row">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="primary-action" type="submit">Sign in</button>
        <div class="divider"><span>or</span></div>
        <button class="google-action" id="google-login" type="button">
          <span aria-hidden="true">G</span>
          Continue with Google
        </button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
