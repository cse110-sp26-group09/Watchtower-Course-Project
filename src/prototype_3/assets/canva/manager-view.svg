  <rect width="800" height="500" fill="#f2f6f9"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#ffffff" stroke="#b8cdd9"/>
  <text x="48" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#1a2a32">Manager View</text>
