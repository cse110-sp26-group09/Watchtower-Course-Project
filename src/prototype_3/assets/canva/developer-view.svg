<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Developer view placeholder</title>
  <desc id="desc">Replace with Canva export for developer dashboard preview.</desc>
  <rect width="800" height="500" fill="#0d1e2f"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#10263a" stroke="#2f4f6b"/>
  <text x="48" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#d7e7f1">Developer View</text>
  <text x="48" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#8eb0c7">Drop your Canva PNG/SVG here and keep this filename.</text>
  <rect x="48" y="160" width="704" height="280" rx="12" fill="#0b1a29" stroke="#37536f" stroke-dasharray="8 8"/>
  <text x="400" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#6eaec5">Canva Export Placeholder</text>
</svg>
