<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — WatchTower</title>
  <link rel="icon" type="image/png" href="assets/watchtower-transparent.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top brand header -->
  <header class="auth-header">
    <a href="login.html" class="header-brand">
      <img src="assets/watchtower-transparent.png" alt="" class="header-logo">
      <span>WatchTower</span>
    </a>
  </header>

  <main class="auth-page">
    <div class="auth-card">

      <h1>Create your account</h1>
      <p class="auth-subtitle">Start monitoring your apps with WatchTower.</p>

      <!-- Status banner — shown/hidden by auth.js after form submit -->
      <div class="status-banner" id="status-banner" role="alert" aria-live="polite"></div>

      <!-- Signup form — action="" is a placeholder for future backend endpoint -->
      <form id="signup-form" method="POST" novalidate>

        <!-- Display name field -->
        <div class="field" id="field-display-name">
          <label for="display-name">Display name</label>
          <input
            id="display-name"
            name="displayName"
            type="text"
            placeholder="Your name"
            autocomplete="name"
            required
          >
          <span class="field-error" id="name-error" role="alert"></span>
        </div>

        <!-- Email field -->
        <div class="field" id="field-email">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@company.com"
            autocomplete="email"
            required
          >
          <span class="field-error" id="email-error" role="alert"></span>
        </div>

        <!-- Password field with show/hide toggle + strength meter -->
        <div class="field" id="field-password">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button type="button" class="toggle-pw" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="m14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <!-- Password strength bar — hidden until user starts typing -->
          <div class="pw-strength" id="pw-strength" hidden>
            <div class="pw-bar"><div class="pw-fill" id="pw-fill"></div></div>
            <span class="pw-label" id="pw-label"></span>
          </div>
          <span class="field-error" id="password-error" role="alert"></span>
        </div>

        <!-- Confirm password field with show/hide toggle -->
        <div class="field" id="field-confirm">
          <label for="confirm-password">Confirm password</label>
          <div class="input-wrap">
            <input
              id="confirm-password"
              name="confirmPassword"
              type="password"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-pw" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="m14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="field-error" id="confirm-error" role="alert"></span>
        </div>

        <!-- Terms of service checkbox -->
        <label class="check-label terms-check">
          <input type="checkbox" name="terms" id="accept-terms" required>
          <span class="check-box"></span>
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
        <span class="field-error" id="terms-error" role="alert"></span>

        <button type="submit" class="btn-primary">Create account</button>
      </form>

      <!-- Google sign-up option (signup only) -->
      <div class="divider"><span>or continue with</span></div>

      <button type="button" class="btn-google" id="google-btn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11.96 11.96 0 0 0 1 12c0 1.94.46 3.77 1.18 5.42l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Google
      </button>

      <!-- Link to login page -->
      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
