<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — WatchTower</title>
  <link rel="icon" type="image/png" href="../assets/fav.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top brand header -->
  <header class="auth-header">
    <a href="login.html" class="header-brand">
      <img src="assets/watchtower-transparent.png" alt="" class="header-logo">
      <span>WatchTower</span>
    </a>
  </header>

  <main class="auth-page">
    <div class="auth-clerk-shell">

      <!-- Status banner — used by auth.js to surface Clerk/config messages -->
      <div class="status-banner" id="status-banner" role="alert" aria-live="polite"></div>

      <!-- Clerk mounts the hosted sign-up component here (it renders its own
           branded card, heading, and sign-in link). Our header bar + page
           background remain the WatchTower shell; Clerk owns account creation,
           sessions, and passwords. No password form lives in our markup. -->
      <div id="clerk-sign-up"></div>

    </div>
  </main>

  <!-- Clerk publishable key (frontend-safe) must load before auth.js -->
  <script src="./clerk-config.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
