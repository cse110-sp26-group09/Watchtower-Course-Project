<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — WatchTower</title>
  <link rel="icon" type="image/png" href="../assets/fav.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top brand header -->
  <header class="auth-header">
    <a href="login.html" class="header-brand">
      <img src="assets/watchtower-transparent.png" alt="" class="header-logo">
      <span>WatchTower</span>
    </a>
  </header>

  <main class="auth-page">
    <div class="auth-card">

      <h1>Reset password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <!-- Status banner — shown/hidden by auth.js after form submit -->
      <div class="status-banner" id="status-banner" role="alert" aria-live="polite"></div>

      <!-- Forgot password form — action="" is a placeholder for future backend endpoint -->
      <form id="forgot-form" method="POST" novalidate>

        <!-- Email field -->
        <div class="field" id="field-email">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@company.com"
            autocomplete="email"
            required
          >
          <span class="field-error" id="email-error" role="alert"></span>
        </div>

        <button type="submit" class="btn-primary">Send reset link</button>
      </form>

      <!-- Link back to login page -->
      <p class="auth-footer">
        <a href="login.html">Back to sign in</a>
      </p>

    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
