<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — WatchTower</title>
  <link rel="icon" type="image/png" href="assets/watchtower-logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top brand header -->
  <header class="auth-header">
    <div class="header-brand">
      <img src="assets/watchtower-logo.png" alt="" class="header-logo">
      <span>WatchTower</span>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">

      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to your WatchTower dashboard.</p>

      <!-- Status banner — shown/hidden by auth.js after form submit -->
      <div class="status-banner" id="status-banner" role="alert" aria-live="polite"></div>

      <!-- Login form — add action attribute when backend endpoint is ready -->
      <form id="login-form" method="POST" novalidate>

        <!-- Email field -->
        <div class="field" id="field-email">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@company.com"
            autocomplete="email"
            required
          >
          <span class="field-error" id="email-error" role="alert"></span>
        </div>

        <!-- Password field with show/hide toggle -->
        <div class="field" id="field-password">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-pw" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="m14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="field-error" id="password-error" role="alert"></span>
        </div>

        <!-- Remember me + forgot password row -->
        <div class="form-row">
          <label class="check-label">
            <input type="checkbox" name="remember" id="remember-me">
            <span class="check-box"></span>
            Remember me
          </label>
          <a href="forgot-password.html" class="link-sm">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <!-- Link to sign up page -->
      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>

    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
