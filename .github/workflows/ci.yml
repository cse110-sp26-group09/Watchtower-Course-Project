name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  basic-repo-checks:
    name: Basic Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print repository structure
        run: |
          echo "Current repository files:"
          ls -la

      - name: Check required root files
        run: |
          echo "Checking required root files..."

          test -f README.md || (echo "README.md is missing" && exit 1)
          test -f .gitignore || (echo ".gitignore is missing" && exit 1)
          test -f CHANGELOG.md || (echo "CHANGELOG.md is missing" && exit 1)

          echo "Required root files exist."

      - name: Check required documentation files
        run: |
          echo "Checking required documentation files..."

          test -d docs || (echo "docs/ folder is missing" && exit 1)
          test -f docs/workflow.md || (echo "docs/workflow.md is missing" && exit 1)
          test -f docs/sprint-1-planning.md || (echo "docs/sprint-1-planning.md is missing" && exit 1)

          echo "Required documentation files exist."

      - name: Check GitHub workflow structure
        run: |
          echo "Checking GitHub workflow structure..."

          test -d .github || (echo ".github/ folder is missing" && exit 1)
          test -d .github/workflows || (echo ".github/workflows/ folder is missing" && exit 1)

          echo "GitHub workflow structure exists."

      - name: Basic repository checks complete
        run: echo "Basic repository checks passed."

  html-validation:
    name: HTML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Nu HTML Checker
        run: |
          echo "Downloading Nu HTML Checker..."
          curl -L -o vnu.jar https://github.com/validator/validator/releases/download/latest/vnu.jar
          echo "Nu HTML Checker downloaded."

      - name: Validate HTML files
        run: |
          echo "Searching for HTML files..."

          HTML_FILES=$(find . -name "*.html" -not -path "./node_modules/*")

          if [ -z "$HTML_FILES" ]; then
            echo "No HTML files found. Skipping HTML validation."
          else
            echo "HTML files found:"
            echo "$HTML_FILES"

            echo "Validating HTML files with Nu HTML Checker..."
            java -jar vnu.jar --skip-non-html $HTML_FILES

            echo "HTML validation completed successfully."
          fi

  css-validation:
    name: CSS Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate CSS files
        run: |
          echo "Searching for CSS files..."

          CSS_FILES=$(find . -name "*.css" -not -path "./node_modules/*")

          if [ -z "$CSS_FILES" ]; then
            echo "No CSS files found. Skipping CSS validation."
          else
            echo "CSS files found:"
            echo "$CSS_FILES"

            echo "Creating temporary Stylelint config..."
            cat > /tmp/stylelint-config.json <<'EOF'
          {
            "rules": {
              "block-no-empty": true,
              "color-no-invalid-hex": true,
              "declaration-block-no-duplicate-properties": true,
              "no-invalid-double-slash-comments": true
            }
          }
          EOF

            echo "Validating CSS files with Stylelint..."
            npx --yes stylelint $CSS_FILES --config /tmp/stylelint-config.json

            echo "CSS validation completed successfully."
          fi
