<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline game preview</title>
  <desc id="desc">Stylized deployment pipeline stages with diagnostics and control lines.</desc>
  <defs>
    <linearGradient id="pipeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151f45"/>
      <stop offset="1" stop-color="#0b162f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#pipeBg)"/>
  <rect x="70" y="90" width="1060" height="520" rx="28" fill="#0f2140" stroke="#355784"/>
  <g fill="#17345d" stroke="#4a78ab" stroke-width="2">
    <rect x="140" y="220" width="180" height="140" rx="18"/>
    <rect x="390" y="220" width="180" height="140" rx="18"/>
    <rect x="640" y="220" width="180" height="140" rx="18"/>
    <rect x="890" y="220" width="180" height="140" rx="18"/>
  </g>
  <g fill="#ddf0ff" font-size="28" font-family="Segoe UI, Arial, sans-serif">
    <text x="180" y="302">Test</text>
    <text x="415" y="302">Canary</text>
    <text x="680" y="302">Deploy</text>
    <text x="932" y="302">Monitor</text>
  </g>
  <g stroke="#83c4ef" stroke-width="4" fill="none">
    <path d="M320 290h68"/>
    <path d="M570 290h68"/>
    <path d="M820 290h68"/>
  </g>
  <text x="145" y="455" fill="#96bbe0" font-size="30" font-family="Segoe UI, Arial, sans-serif">Release Quality Loop</text>
</svg>
